version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jobpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jobpilot-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/jobpilot
      - SECRET_KEY=jobpilot_super_secret_jwt_key_change_in_production_987654321
      - AI_PROVIDER=built-in
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jobpilot-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_exports:
